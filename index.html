<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mockingbird Arts</title>
    <meta
      name="description"
      content="Mockingbird Arts is a new nonprofit serving artists and the people of Austin, through hospitality, artist formation, and cultural engagement for the common good."
    />
    <link rel="canonical" href="https://mkbd.org/" />

    <!-- Social previews. Site-level: every route serves this same file, so a
         shared link to /team still previews as the home page. Per-route meta
         needs prerendering.
         The card image is generated from design/social-card.html. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mockingbird Arts" />
    <meta property="og:title" content="Mockingbird Arts" />
    <meta
      property="og:description"
      content="A new nonprofit serving artists and the people of Austin, through hospitality, artist formation, and cultural engagement for the common good."
    />
    <meta property="og:url" content="https://mkbd.org/" />
    <meta property="og:image" content="https://mkbd.org/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Mockingbird Arts logo above the words: Artists in community, engaging the city, enriching the culture." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mockingbird Arts" />
    <meta
      name="twitter:description"
      content="A new nonprofit serving artists and the people of Austin, through hospitality, artist formation, and cultural engagement for the common good."
    />
    <meta name="twitter:image" content="https://mkbd.org/og-card.png" />

    <link rel="stylesheet" href="https://use.typekit.net/gsh7kwc.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
