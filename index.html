<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mockingbird Arts</title>
    <meta
      name="description"
      content="Mockingbird Arts is a new nonprofit serving artists and the people of Austin, through hospitality, artist formation, and cultural engagement for the common good."
    />
    <link rel="canonical" href="https://mkbd.org/" />

    <!-- Social previews. Until a 1200x630 card image exists these use the
         512px logo, so twitter:card is "summary" (small square) rather than
         "summary_large_image", which would crop the logo badly.
         These are site-level: every route serves this same file, so a shared
         link to /team still previews as the home page. Per-route meta needs
         prerendering. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mockingbird Arts" />
    <meta property="og:title" content="Mockingbird Arts" />
    <meta
      property="og:description"
      content="A new nonprofit serving artists and the people of Austin, through hospitality, artist formation, and cultural engagement for the common good."
    />
    <meta property="og:url" content="https://mkbd.org/" />
    <meta property="og:image" content="https://mkbd.org/web-app-manifest-512x512.png" />
    <meta property="og:image:alt" content="The Mockingbird Arts logo" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Mockingbird Arts" />
    <meta
      name="twitter:description"
      content="A new nonprofit serving artists and the people of Austin, through hospitality, artist formation, and cultural engagement for the common good."
    />
    <meta name="twitter:image" content="https://mkbd.org/web-app-manifest-512x512.png" />

    <link rel="stylesheet" href="https://use.typekit.net/gsh7kwc.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
